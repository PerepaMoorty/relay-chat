name: Bug report
description: Report a defect found while testing Relay
title: "[BUG] "
labels: ["bug"]
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - sev:critical
        - sev:major
        - sev:minor
    validations:
      required: true
  - type: input
    id: requirement
    attributes:
      label: Requirement / test case
      description: The requirement ID and test case that fails.
      placeholder: "CHAT-F-004 / TC-F-004"
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Contract quote
      description: Quote the exact line of the control file (section 6) or SRS that this behaviour violates.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What happened instead, including any error code or message.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: registry
    attributes:
      label: Registry PR ID(s) suspected
      placeholder: "B8"
